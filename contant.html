<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CookCraft - Contact Us</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">🍳 CookCraft</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="categories.html">Categories</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>
    <section class="contact-section">

        <h1>Contact Us</h1>

        <p>
            Have a question, suggestion or feedback?
            Send us a message.
        </p>

    </section>


    <section>

        <div class="contact-form">

            <h2>Send Us a Message</h2>

            <form id="contactForm">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >


                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >


                <label>Subject</label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Enter subject"
                >


                <label>Message</label>

                <textarea
                    id="message"
                    placeholder="Write your message">
                </textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>

            <p id="formMessage"></p>

        </div>

    </section>


    <section class="contact-info">

        <h2>Get in Touch</h2>

        <p>📧 Email: cookcraft@example.com</p>

        <p>📞 Phone: +91 98765 43210</p>

        <p>📍 Location: India</p>

    </section>


    <footer>

        <p>
            © 2026 CookCraft | Recipe & Cooking Platform
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
